<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Group Project</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">


<link rel="stylesheet" href="./style.css">

</head>

<body>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrVWrXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>

    <!-- AOS JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js">
    </script>

    <!-- AOS Initialization -->
    <script>
        AOS.init();
    </script>

<!-- ========================================= -->
<!-- PETTRACE NAVBAR -->
<!-- ========================================= -->

<nav class="navbar navbar-expand-lg pet-navbar">

    <div class="container-fluid px-lg-5">

        <!-- Logo -->
        <a class="navbar-brand pet-logo" href="#">

            <span class="logo-paw">
                <i class="bi bi-paw-fill"></i>
            </span>

            <span>PetTrace</span>

        </a>


        <!-- Mobile Menu Button -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#petNavbar"
        >

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- Navigation -->
        <div class="collapse navbar-collapse" id="petNavbar">

            <!-- Menu -->
            <ul class="navbar-nav mx-auto gap-lg-4">

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="#">
                        Explore
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        Community
                    </a>
                </li>

            </ul>


            <!-- Right Side -->
            <div class="navbar-actions d-flex align-items-center gap-3">

                <!-- Report Button -->
                <button class="report-btn">

                    Report a Pet

                    <i class="bi bi-arrow-right"></i>

                </button>


                <!-- User -->
                <button class="icon-btn">

                    <i class="bi bi-person"></i>

                </button>


                <!-- Menu -->
                <button class="icon-btn">

                    <i class="bi bi-list"></i>

                </button>

            </div>

        </div>

    </div>

</nav>

<!-- ========================================= -->
<!-- END PETTRACE NAVBAR -->
<!-- ========================================= -->
 <!-- ================================================= -->
<!-- HERO SECTION -->
<!-- ================================================= -->

<section class="hero-section">

    <!-- Main Hero Container -->
    <div class="container-fluid px-lg-5">

        <div class="row align-items-center">

            <!-- ========================================= -->
            <!-- HERO LEFT SIDE -->
            <!-- ========================================= -->

            <div class="col-lg-6 hero-content">

                <!-- Small Hero Label -->
                <div class="hero-label">

                    <i class="bi bi-paw-fill"></i>

                    REAL PETS. REAL PEOPLE. REAL HOPE.

                </div>


                <!-- Main Hero Heading -->
                <h1>

                    Find. Follow.

                    <span>Reunite.</span>

                </h1>


                <!-- Hero Description -->
                <p class="hero-description">

                    Search for lost, found, or sighted pets in your area
                    and help bring them home.

                </p>


                <!-- ========================================= -->
                <!-- SEARCH BOX -->
                <!-- ========================================= -->

                <div class="search-box">

                    <!-- Search Icon -->
                    <i class="bi bi-search"></i>

                    <!-- Search Input -->
                    <input
                        type="text"
                        placeholder="Search by pet name, breed, or location..."
                    >

                    <!-- Search Button -->
                    <button>

                        Search

                        <i class="bi bi-arrow-right"></i>

                    </button>

                </div>


                <!-- ========================================= -->
                <!-- FILTER BUTTONS -->
                <!-- ========================================= -->

                <div class="filter-row">

                    <!-- All Button -->
                    <button class="filter-btn active">
                        All
                    </button>

                    <!-- Lost Button -->
                    <button class="filter-btn">
                        Lost
                    </button>

                    <!-- Found Button -->
                    <button class="filter-btn">
                        Found
                    </button>

                    <!-- Sighted Button -->
                    <button class="filter-btn">
                        Sighted
                    </button>

                    <!-- Dogs Button -->
                    <button class="filter-btn">

                        <i class="bi bi-house-heart"></i>

                        Dogs

                    </button>

                    <!-- Cats Button -->
                    <button class="filter-btn">

                        <i class="bi bi-emoji-smile"></i>

                        Cats

                    </button>

                    <!-- Other Button -->
                    <button class="filter-btn">

                        <i class="bi bi-flower1"></i>

                        Other

                    </button>

                    <!-- Nearby Button -->
                    <button class="filter-btn">

                        <i class="bi bi-geo-alt"></i>

                        Nearby

                        <i class="bi bi-chevron-down"></i>

                    </button>

                </div>

            </div>


            <!-- ========================================= -->
            <!-- HERO RIGHT SIDE / CAT IMAGE -->
            <!-- ========================================= -->

            <div class="col-lg-6 hero-image-column">

                <div class="hero-image-wrapper">

                    <!-- Decorative Pink Shape -->
                    <div class="pink-shape"></div>
                    <!-- Main Cat Image -->
                    <img
                        src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=900&q=85"
                        alt="Cute cat"
                        class="hero-cat-image"
                    >


                    <!-- Floating Paw -->
                    <div class="floating-paw">

                        <i class="bi bi-paw-fill"></i>

                    </div>


                    <!-- ================================= -->
                    <!-- LEFT DECORATIVE TEXT -->
                    <!-- ================================= -->

                    <div class="hero-note note-one">

                        A small
                        <br>
                        step can make
                        <br>
                        a big difference.

                        <span>♡</span>

                    </div>


                    <!-- ================================= -->
                    <!-- RIGHT DECORATIVE TEXT -->
                    <!-- ================================= -->

                    <div class="hero-note note-two">

                        Different
                        <br>
                        paths.
                        <br>
                        Same home.

                        <span>♡</span>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- ================================================= -->
<!-- END HERO SECTION -->
<!-- ================================================= -->



</body>

</html>
