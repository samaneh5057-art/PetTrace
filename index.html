<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Group Project</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">


<link rel="stylesheet" href="./style.css">

</head>

<body>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrVWrXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>

    <!-- AOS JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js">
    </script>

    <!-- AOS Initialization -->
    <script>
        AOS.init();
    </script>

<main>

    <!-- =========================
         HERO SECTION
    ========================== -->

    <section class="hero-section">

        <div class="page-container hero-grid">

            <!-- HERO TEXT -->
            <div class="hero-content">

                <span class="eyebrow">
                    <i class="bi bi-paw-fill"></i>
                    REAL PETS. REAL PEOPLE. REAL HOPE.
                </span>

                <h1>
                    Find. Follow.<br>
                    <em>Reunite.</em>
                </h1>

                <p class="hero-description">
                    Search for lost, found, or sighted pets in your area
                    and help bring them home.
                </p>

                <!-- SEARCH -->
                <form class="search-box">

                    <i class="bi bi-search"></i>

                    <input
                        type="text"
                        placeholder="Search by pet name, breed, or location..."
                    >

                    <button type="submit">
                        Search
                        <i class="bi bi-arrow-right"></i>
                    </button>

                </form>

            </div>


            <!-- HERO IMAGE -->
            <div class="hero-visual">

                <div class="hero-blob"></div>

                <img
                    class="hero-cat-image"
                    src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=1000&q=85"
                    alt="Cute cat"
                >

                <!-- LEFT NOTE -->
                <div class="hero-note note-one">
                    A small<br>
                    step can make<br>
                    a big difference.
                    <span>♡</span>
                </div>

                <!-- RIGHT NOTE -->
                <div class="hero-note note-two">
                    Different<br>
                    paths.<br>
                    Same home.
                    <span>♡</span>
                </div>

                <!-- PAWS -->
                <div class="floating-paw paw-one">
                    <i class="bi bi-paw-fill"></i>
                </div>

                <div class="floating-paw paw-two">
                    <i class="bi bi-paw-fill"></i>
                </div>

            </div>

        </div>

    </section>




</body>

</html>
