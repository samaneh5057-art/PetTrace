<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PetTrace — Every Paw Deserves to Find Its Way Home</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
  

    <!-- =====================================================
         REPORT MODAL
    ====================================================== -->

    <div class="modal-overlay" id="reportModal">

        <div class="report-modal">

            <button class="modal-close" id="closeModal">
                <i class="bi bi-x-lg"></i>
            </button>


            <div class="modal-icon">
                <i class="bi bi-paw-fill"></i>
            </div>


            <span class="section-label">
                PETTRACE REPORT
            </span>


            <h2>
                What would you like to report?
            </h2>


            <p>
                Choose an option and we'll help you
                take the next step.
            </p>


            <div class="modal-options">


                <!-- LOST -->

                <button
                    class="modal-option"
                    data-modal-action="lost">

                    <i class="bi bi-search"></i>

                    <span>

                        <strong>
                            Lost Pet
                        </strong>

                        <small>
                            Report a missing pet
                        </small>

                    </span>

                    <i class="bi bi-arrow-right"></i>

                </button>


                <!-- FOUND -->

                <button
                    class="modal-option"
                    data-modal-action="found">

                    <i class="bi bi-house-fill"></i>

                    <span>

                        <strong>
                            Found Pet
                        </strong>

                        <small>
                            Help reunite a pet
                        </small>

                    </span>

                    <i class="bi bi-arrow-right"></i>

                </button>


                <!-- SIGHTED -->

                <button
                    class="modal-option"
                    data-modal-action="sighted">

                    <i class="bi bi-eye-fill"></i>

                    <span>

                        <strong>
                            Pet Sighting
                        </strong>

                        <small>
                            Share where you saw a pet
                        </small>

                    </span>

                    <i class="bi bi-arrow-right"></i>

                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         TOAST
    ====================================================== -->

    <div class="toast-message" id="toast">

        <i class="bi bi-check-circle-fill"></i>

        <span id="toastText">
            Done!
        </span>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
